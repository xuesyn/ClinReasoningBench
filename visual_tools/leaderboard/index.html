<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClinReasoningBench Leaderboard</title>
    <link rel="stylesheet" href="./assets/styles/base.css" />
    <link rel="stylesheet" href="./assets/styles/site-shell.css" />
    <link rel="stylesheet" href="./assets/styles/results.css" />
    <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  </head>
  <body class="results-page">
    <header class="pagebar">
      <div class="pagebar__title">ClinReasoningBench Leaderboard</div>
      <nav class="site-nav">
        <a class="site-nav__link" href="https://docs.google.com/forms/d/e/1FAIpQLSdIQ0Na0vcc0U0zf6xxlBlZdG46DBKz_swL1KdB5CqH54twhA/viewform" target="_blank" rel="noreferrer">Submit your model</a>
        <a class="site-nav__link" href="https://github.com/xuesyn/ClinReasoningBench/tree/main" target="_blank" rel="noreferrer">GitHub</a>
      </nav>
    </header>

    <main class="results-shell">
      <section class="dashboard">
        <article class="panel panel--wide">
          <div class="section-head">
            <div>
              <h2>Detailed Score Table</h2>
              <p class="section-note">Best model per metric is highlighted; hover a row to compare.</p>
            </div>
          </div>
          <div class="table-wrap" id="metricTables"></div>
        </article>

        <section class="toolbar panel">
          <div class="toolbar__left">
            <label class="field">
              <span>Metric</span>
              <select id="metricSelect"></select>
            </label>
          </div>
          <div class="toolbar__right" id="metricMeta"></div>
        </section>

        <article class="panel panel--wide">
          <div class="section-head">
            <div>
              <h2>Per-Dataset View</h2>
              <p class="section-note">Bars ranked per dataset for the selected metric; ▸ marks the best.</p>
            </div>
          </div>
          <div class="small-multiples" id="smallMultiples"></div>
        </article>
      </section>
    </main>

    <script type="module" src="./assets/js/results-page.js"></script>
  </body>
</html>
