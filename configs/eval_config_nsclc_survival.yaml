experiment_name: nsclc_survival_eval
output_dir: outputs

# 定义需要评测的模型
models:
  <model_name>:
    type: openai # 对应 med_eval_pipeline/models/ 下的文件名 (api_openai.py -> openai)
    model_name: "<model_name>" # 请替换为你要使用的模型名称
    api_key: "YOUR_API_KEY_HERE" # 请替换为你的 API Key
    base_url: "" # 请替换为你的 base_url，例如 "https://api.openai.com/v1"
    max_tokens: 8192
    temperature: 0.1
    max_retry: 3
    timeout: 120

# 定义需要评测的数据集
datasets:
  NSCLC:
    gt_path: ["eval_data/latest/labeled_nsclc_Baichuan-M3-Plus_treatment/benchmark_nsclc_1_gt.jsonl","eval_data/latest/labeled_nsclc_Baichuan-M3-Plus_treatment/benchmark_nsclc_2_gt.jsonl","eval_data/latest/labeled_nsclc_Baichuan-M3-Plus_treatment/benchmark_nsclc_3_gt.jsonl","eval_data/latest/labeled_nsclc_Baichuan-M3-Plus_treatment/benchmark_nsclc_4_gt.jsonl","eval_data/latest/labeled_nsclc_Baichuan-M3-Plus_treatment/benchmark_nsclc_5_gt.jsonl","eval_data/latest/labeled_nsclc_Baichuan-M3-Plus_treatment/cleaned_cohort_part_1_1_gt.jsonl","eval_data/latest/labeled_nsclc_Baichuan-M3-Plus_treatment/cleaned_cohort_part_2_1_gt.jsonl"]
    graph_def_path: "data/NSCLC/lungcancer_graph_beta_tag.json"
    prompt_template_path: "prompts/thinking_survival_time_nsclc.txt" # 可选
    reference_guideline_name: "中华医学会肺癌临床诊疗指南（2024版）"
    task: "survival"

# 评测参数
evaluation_params:
  pass_k: 1 # pass@k 的 k 值
  num_workers: 8 # 并行推理/评分的 worker 数量
  skip_inference: false # 是否跳过推理，直接进行评分（用于重新评分）
  save_interval: 10

# 定义需要计算的 Metrics
metrics:
  survival_calibration: {ipcw_min_g: 0.05, skip_zero_surv: true, default_pred_surv: -1.0, default_conf: 0.0, cancer_type: 'nsclc'}

