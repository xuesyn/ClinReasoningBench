experiment_name: default_eval
output_dir: outputs

# 定义需要评测的模型
models:
  <model_name>:
    type: openai # 对应 med_eval_pipeline/models/ 下的文件名 (api_openai.py -> openai)
    model_name: "<model_name>" # 请替换为你要使用的模型名称
    api_key: "YOUR_API_KEY_HERE" # 请替换为你的 API Key
    base_url: "" # 请替换为你的 base_url，例如 "https://api.openai.com/v1"
    max_tokens: 8192
    temperature: 0.1
    max_retry: 3
    timeout: 120

# 定义需要评测的数据集
# 支持多数据集同时评测，按需选择或组合疾病
datasets:
  CNLC:
    gt_path: ["eval_data/labeled_cnlc/processed_jsonl_gt_treatment/filtered_part_0_gt.jsonl"]
    graph_def_path: "data/CNLC/cnlc_graph_beta_v1.json"
 # reference_map_path: "data/CNLC/cnlc_guidance.jsonl" # 可选
    prompt_template_path: "prompts/thinking_all_task_cite_version.txt"  # treatment 时用；survival 时改为 prompts/thinking_survival_time.txt
    reference_guideline_name: "原发性肝癌诊疗指南（2024 年版）"
    task: "treatment"  # "treatment" 或 "survival"
 # meta_path 将由 eval.py 自动生成并填充

# 评测参数
evaluation_params:
  pass_k: 1                 # pass@k 的 k 值
  num_workers: 8            # 并行推理/评分的 worker 数量
  skip_inference: false     # 是否跳过推理，直接进行评分（用于重新评分）
  save_interval: 10

# 定义需要计算的 Metrics
# 下面列出 treatment task 的一整套指标；如果 task 为 survival，请注释这一整块，
# 改用最底部 survival_calibration 那一条。
metrics:
  GraphBasedMetric: {
    use_hard_check_score: false,
    knowledge_calc_method: 'semantic',
    knowledge_db_path: 'data/CNLC/cnlc_guidance.jsonl',
    knowledge_key: 'original_text',
    model_local_path: 'ckpt/bge-large-zh-v1.5',
    similarity_threshold: 0.8
  }
  treatment_score: {threshold: 0.5}
  staging_score: {allowed_stagings: ['Ia', 'Ib', 'IIa', 'IIb', 'IIIa', 'IIIb', 'IV']}
  Indication_and_contraindication_score: {}
  treatment_calibration: {threshold: 0.5, k: null, top_m: 3, tau: 1, use_position_weighting: true}
 # --- survival task 请用以下一条替换上面所有 treatment 指标 ---
 # survival_calibration: {ipcw_min_g: 0.05, skip_zero_surv: true, default_pred_surv: -1.0, default_conf: 0.0, cancer_type: 'cnlc'}

